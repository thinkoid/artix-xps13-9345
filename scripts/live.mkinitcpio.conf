# The live stick's initramfs, for the Dell XPS 13 9345 (doc 7.5, step 6).
#
# The tarball's own initramfs relies on mkinitcpio's autodetect, which keeps
# only the modules the generating machine is using: that machine was the
# distribution's build host, and the image misses everything this
# architecture needs to boot from USB. So autodetect is off, and the modules
# are named here: the Type-C / USB host chain and the DSP path the X1E80100
# needs before a USB root can appear. build-stick.sh drops this file into the
# live root as /etc/mkinitcpio.conf.d/live.conf and regenerates the image
# there, with the kms hook off as well (it would load the display driver).
MODULES=(phy-qcom-eusb2-repeater phy-snps-eusb2 ps883x gpio-sbu-mux
         pmic_glink pmic_glink_altmode typec_ucsi ucsi_glink
         qcom_q6v5_pas qcom_pd_mapper qcom_pdr_msg pdr_interface
         qrtr qrtr-smd rpmsg_ctrl qcom_battmgr
         i2c-hid-of i2c-hid hid-multitouch)
# build-stick.sh appends a FILES=(...) line naming the board's firmware.
